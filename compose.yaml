# Base stack shared by every environment: the web process and the task worker, one image.
# DEV adds compose.override.yaml automatically; TEST/PROD use compose.prod.yaml.
name: manager-warsztatow

services:
  web:
    image: ghcr.io/marekwo/manager-warsztatow:${APP_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MIGRATIONS: "true"
      DATA_DIR: /data
    volumes:
      - data:/data
    restart: unless-stopped

  worker:
    image: ghcr.io/marekwo/manager-warsztatow:${APP_TAG:-dev}
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    depends_on:
      web:
        condition: service_healthy
    # The worker serves no HTTP, so the image's check does not fit: it is healthy while the
    # every-minute heartbeat job keeps succeeding. Compose 2.x's `up --wait` (scripts/update.sh)
    # also fails outright on a service whose check is disabled.
    healthcheck:
      test: ["CMD", "python", "manage.py", "shell", "--no-imports", "-c", "import sys; from workshop_manager.core.tasks import worker_status; sys.exit(worker_status()[0] != 'ok')"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      start_interval: 10s
      retries: 3
    restart: unless-stopped

volumes:
  data:
