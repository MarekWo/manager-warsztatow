name: CI

# A push that only touches the prose runs nothing; a manual run always does.
on:
  push:
    branches: [dev, main]
    paths: &code
      - "**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!LICENSE"
      - "!docs/**"
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: ${{ vars.CI_RUNNER == '' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Type check
        run: uv run mypy workshop_manager

      # WeasyPrint (PDF printouts) needs Pango; without it the PDF tests are skipped, not failed.
      - name: PDF libraries
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Beside the unit suite rather than after it, so a browser flake never holds back the results.
  browser:
    name: Browser tests (Playwright + axe)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # Servers enforce the policy, so a violation has to fail here, not just be reported.
      CSP_ENFORCE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: ${{ vars.CI_RUNNER == '' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium and its system libraries
        run: uv run playwright install --with-deps chromium

      - name: Browser tests
        run: >-
          uv run pytest -m browser
          --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: pip-audit
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
