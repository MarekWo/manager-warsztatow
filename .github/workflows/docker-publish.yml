# Builds the application image and pushes it to GHCR.
#   dev branch  → ghcr.io/marekwo/manager-warsztatow:dev     (TEST)
#                 and :<VERSION> too when VERSION is a release candidate (no -dev), e.g. 1.0.0-rc1
#   main branch → ghcr.io/marekwo/manager-warsztatow:latest and :<VERSION>   (PROD)
name: Docker publish

# The image carries no docs (.dockerignore), so a prose-only push builds nothing.
on:
  push:
    branches: [dev, main]
    paths:
      - "**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!LICENSE"
      - "!docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/manager-warsztatow"
          VERSION="$(tr -d ' \r\n' < VERSION)"
          BRANCH="${GITHUB_REF_NAME}"

          if [ "$BRANCH" = "main" ]; then
            case "$VERSION" in
              *-dev*) echo "::error::VERSION ($VERSION) must not carry -dev on main"; exit 1 ;;
            esac
            TAGS="${IMAGE}:latest,${IMAGE}:${VERSION}"
          else
            TAGS="${IMAGE}:${BRANCH}"
            case "$VERSION" in
              *-dev*) ;;
              *) TAGS="${TAGS},${IMAGE}:${VERSION}" ;;
            esac
          fi

          echo "Tags: $TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
