{% extends "panel/base_panel.html" %}
{% block title %}Usuń szkic{% endblock %}
{% block panel_content %}
<h1 class="page-title mb-3">Usunąć szkic „{{ workshop.title }}”?</h1>
<p>Szkic zniknie razem z terminami, poziomami i pytaniami. Tej operacji nie można cofnąć.</p>
<form method="post" class="d-flex gap-2">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Tak, usuń</button>
  <a class="btn btn-outline-primary" href="{% url 'panel:workshop_edit' workshop.pk %}">Nie, wróć</a>
</form>
{% endblock %}
