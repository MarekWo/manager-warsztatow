<form method="get" class="row g-2 mb-3 align-items-end" role="search" aria-label="Filtry zgłoszeń">
  <div class="col-md-4">
    <label class="form-label small mb-1" for="f-q">Nazwisko, imię lub e-mail</label>
    <input type="search" class="form-control" id="f-q" name="q" value="{{ filters.q }}">
  </div>
  <div class="col-md-3">
    <label class="form-label small mb-1" for="f-status">Status</label>
    <select class="form-select" id="f-status" name="status">
      <option value="">wszystkie</option>
      <option value="active" {% if filters.status == "active" %}selected{% endif %}>aktywne (nowe, przyjęte, rezerwa)</option>
      {% for value, label in statuses %}<option value="{{ value }}" {% if value == filters.status %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  {% if workshop %}
  <div class="col-md-2">
    <label class="form-label small mb-1" for="f-level">Poziom</label>
    <select class="form-select" id="f-level" name="level">
      <option value="">wszystkie</option>
      {% for level in workshop.levels.all %}<option value="{{ level.pk }}" {% if filters.level == level.pk|stringformat:"d" %}selected{% endif %}>{{ level.name }}</option>{% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="col-md-{% if workshop %}3{% else %}5{% endif %} d-flex flex-wrap gap-3 align-items-center">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="unseen" value="1" id="f-unseen" {% if filters.unseen %}checked{% endif %}>
      <label class="form-check-label" for="f-unseen">tylko nieprzejrzane</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="order" value="newest" id="f-order" {% if filters.order == "newest" %}checked{% endif %}>
      <label class="form-check-label" for="f-order">najnowsze na górze</label>
    </div>
    <button type="submit" class="btn btn-outline-primary">Pokaż</button>
  </div>
</form>
